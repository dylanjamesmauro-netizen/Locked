<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css">
  <style>
    .games-page {
      width: 100%; max-width: 1220px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .featured-strip {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    .feat-banner {
      height: 54px; border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex; align-items: center; padding: 0 18px;
      cursor: pointer; box-shadow: 0 0 16px var(--accent-glow);
    }
    .feat-banner-title {
      font-size: 16px; font-weight: 800; color: #fff;
    }
    .games-search-input {
      width: 100%; padding: 13px 18px; border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg); color: #fff; font-size: 14px;
    }
    .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-pill {
      padding: 8px 15px; border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--row-bg); color: #94a3b8;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cat-pill.active {
      background: var(--accent); color: #fff;
    }
    .section-heading {
      font-size: 22px; font-weight: 800; color: #f8fafc;
    }
    .games-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
    }
    .game-card {
      position: relative; aspect-ratio: 16 / 10; border-radius: 16px;
      overflow: hidden; border: 2px solid var(--border-color);
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .game-art { text-align: center; pointer-events: none; }
    .game-emoji { font-size: 46px; }
    .game-art-label {
      font-size: 17px; font-weight: 900; color: #fff;
    }
    .game-top-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; z-index: 3;
    }
    .game-tag-pill {
      padding: 3px 9px; border-radius: 999px; margin-right: 4px;
      background: rgba(10, 8, 22, 0.78);
      color: #f8fafc; font-size: 11px; font-weight: 700;
    }
    .game-fav-btn {
      width: 30px; height: 30px; border-radius: 9px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .game-bottom-overlay {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 20px 12px 10px;
      background: linear-gradient(transparent, rgba(5, 4, 12, 0.92));
      display: flex; justify-content: space-between;
    }
    .game-card-title { font-size: 14px; font-weight: 800; color: #fff; }
    .game-views-pill { font-size: 11px; color: #cbd5e1; }
    .player-view {
      display: none; width: 100%; max-width: 1040px;
      flex-direction: column; align-items: center; gap: 16px;
    }
    .player-stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      border-radius: 20px; overflow: hidden;
      border: 1px solid var(--border-color); background: #070510;
    }
    .player-splash {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 4;
    }
    .player-center-icon {
      width: 120px; height: 120px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; border: 2px solid rgba(255, 255, 255, 0.25);
    }
    .player-play-btn {
      padding: 12px 30px; border-radius: 12px; border: none;
      background: var(--accent-bright); color: #fff;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .game-iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: none; z-index: 3;
    }
    .player-bar {
      width: 100%; display: flex; justify-content: space-between;
      padding: 12px 18px; border-radius: 16px;
      background: var(--card-bg); border: 1px solid var(--border-color);
    }
    .p-icon-btn {
      background: none; border: none; color: #cbd5e1;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo"></div>
        <span class="brand-name">Locked</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item">Home</a>
        <a href="search.html" class="nav-item">Web Search</a>
        <a href="games.html" class="nav-item active">Games</a>
        <a href="ai.html" class="nav-item">AI Helper</a>
        <a href="about.html" class="nav-item">About</a>
      </div>
    </div>
    <div class="sidebar-bottom">
      <a href="account.html" class="nav-item">Sign In</a>
      <a href="settings.html" class="nav-item">Settings</a>
    </div>
  </div>
  <div class="content" style="padding: 26px 32px;">
    <div class="games-page" id="games-browse-view">
      <div class="featured-strip" id="featured-strip"></div>
      <input type="text" id="games-search" class="games-search-input"
        placeholder="Search Games Here..." oninput="renderGamesGrid()">
      <div class="cat-pills" id="cat-pills"></div>
      <div class="section-heading" id="games-heading">All Games</div>
      <div class="games-grid" id="games-grid"></div>
    </div>
    <div class="player-view" id="player-view">
      <div class="player-stage" id="player-stage">
        <div class="player-splash" id="player-splash">
          <div class="player-center-icon" id="player-center-icon">🎮</div>
          <button type="button" class="player-play-btn"
            onclick="launchCurrentGame()">Play Now</button>
        </div>
        <iframe id="game-iframe" class="game-iframe"></iframe>
      </div>
      <div class="player-bar">
        <div>
          <button class="p-icon-btn" onclick="closeGamePlayer()">← Back</button>
          <span id="p-title" style="font-weight:800;">Game</span>
          <button class="p-icon-btn" id="p-fav-btn"
            onclick="togglePlayerFav()">☆</button>
        </div>
        <button class="player-play-btn" style="padding:6px 14px;"
          onclick="toggleGameFullscreen()">⛶ Fullscreen</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    function makeDoc(body, code) {
      var st = 'margin:0;background:#070913;color:#fff;font-family:sans-serif;' +
        'display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;height:100vh;overflow:hidden;';
      return '<!DOCTYPE html><html><body style="' + st + '">' +
        body + '<' + 'script>' + code + '<' + '/script></body></html>';
    }
    var GAMES = [
      { id: 'retro-bowl', title: 'Retro Bowl', tags: ['Sports', 'Popular'],
        views: '248k', emoji: '🏈', bg: 'linear-gradient(135deg,#15803d,#14532d)',
        html: makeDoc('<div>TDs: <span id="td">0</span> | Mouse + Click</div>' +
          '<canvas id="c" width="500" height="300" style="background:#166534;"></canvas>',
          'var c=document.getElementById("c"),ctx=c.getContext("2d"),py=150,b=null,df=[],td=0,f=0;' +
          'c.onmousemove=function(e){py=e.clientY-c.getBoundingClientRect().top;};' +
          'c.onclick=function(){if(!b)b={x:80,y:py};};' +
          'setInterval(function(){f++;if(f%45===0)df.push({x:490,y:Math.random()*260+20});' +
          'ctx.clearRect(0,0,500,300);ctx.fillStyle="#facc15";ctx.fillRect(460,0,40,300);' +
          'ctx.fillStyle="#38bdf8";ctx.fillRect(60,py-10,20,20);' +
          'if(b){b.x+=9;ctx.fillStyle="#fff";ctx.fillRect(b.x,b.y-4,12,8);' +
          'if(b.x>465){td++;document.getElementById("td").innerText=td;b=null;df=[];}}' +
          'ctx.fillStyle="#ef4444";df.forEach(function(d){d.x-=3.5;ctx.fillRect(d.x,d.y-10,20,20);' +
          'if(Math.abs(70-d.x)<18&&Math.abs(py-d.y)<18){td=0;document.getElementById("td").innerText=0;df=[];}});' +
          '},16);') },
      { id: 'geometry-dash', title: 'Geometry Dash', tags: ['Action', 'Popular'],
        views: '312k', emoji: '🟨', bg: 'linear-gradient(135deg,#0284c7,#1e1b4b)',
        html: makeDoc('<div>Score: <span id="sc">0</span>% | Click / Space</div>' +
          '<canvas id="c" width="500" height="260" style="background:#0f172a;"></canvas>',
          'var c=document.getElementById("c"),ctx=c.getContext("2d"),y=190,vy=0,ob=[],f=0,sc=0;' +
          'function j(){if(y>=190)vy=-11.5;}c.onclick=j;document.onkeydown=function(e){if(e.code==="Space")j();};' +
          'setInterval(function(){f++;vy+=0.68;y+=vy;if(y>190){y=190;vy=0;}' +
          'if(f%65===0)ob.push({x:510});if(f%15===0){sc=Math.min(100,sc+1);document.getElementById("sc").innerText=sc;}' +
          'ctx.clearRect(0,0,500,260);ctx.fillStyle="#38bdf8";ctx.fillRect(0,220,500,4);' +
          'ctx.fillStyle="#facc15";ctx.fillRect(80,y,28,28);ctx.fillStyle="#f43f5e";' +
          'ob.forEach(function(o){o.x-=6;ctx.fillRect(o.x,192,22,28);' +
          'if(105>o.x&&80<o.x+22&&y+26>192){ob=[];sc=0;document.getElementById("sc").innerText=0;}});},16);') }
    ];
  </script>
  <script>
    GAMES.push(
      { id: 'slope', title: 'Slope', tags: ['Action', 'Popular'],
        views: '289k', emoji: '🟢', bg: 'linear-gradient(135deg,#16a34a,#064e3b)',
        html: makeDoc('<div>Score: <span id="sc">0</span> | Left / Right Arrows</div>' +
          '<canvas id="c" width="500" height="300" style="background:#05080f;"></canvas>',
          'var c=document.getElementById("c"),ctx=c.getContext("2d"),bx=250,k={},bl=[],f=0,sc=0;' +
          'document.onkeydown=function(e){k[e.key]=1;};document.onkeyup=function(e){k[e.key]=0;};' +
          'setInterval(function(){f++;if(k.ArrowLeft)bx-=5.5;if(k.ArrowRight)bx+=5.5;' +
          'if(f%26===0){bl.push({x:80+Math.random()*340,y:20});sc++;document.getElementById("sc").innerText=sc;}' +
          'ctx.clearRect(0,0,500,300);ctx.fillStyle="#ef4444";' +
          'bl.forEach(function(b){b.y+=5;ctx.fillRect(b.x-15,b.y,30,20);' +
          'if(Math.abs(bx-b.x)<22&&Math.abs(260-b.y)<18){bl=[];sc=0;bx=250;document.getElementById("sc").innerText=0;}});' +
          'ctx.fillStyle="#4ade80";ctx.beginPath();ctx.arc(bx,260,12,0,6.28);ctx.fill();},16);') },
      { id: 'stickman-hook', title: 'Stickman Hook', tags: ['Action', 'Popular'],
        views: '195k', emoji: '🪝', bg: 'linear-gradient(135deg,#e11d48,#4c0519)',
        html: makeDoc('<div>Dist: <span id="sc">0</span>m | Hold Click / Space</div>' +
          '<canvas id="c" width="500" height="280" style="background:#110b24;"></canvas>',
          'var c=document.getElementById("c"),ctx=c.getContext("2d"),px=90,py=110,vx=4,vy=0,h=0,cam=0,gr=null;' +
          'var pts=[{x:210,y:50},{x:390,y:45},{x:580,y:55},{x:770,y:45},{x:960,y:55}];' +
          'function dn(){h=1;gr=pts.find(function(p){return p.x>px;});}function up(){h=0;gr=null;}' +
          'c.onmousedown=dn;window.onmouseup=up;document.onkeydown=function(e){if(e.code==="Space")dn();};document.onkeyup=up;' +
          'setInterval(function(){vy+=0.25;if(h&&gr){vx+=(gr.x-px)*0.004;vy+=(gr.y-py)*0.004;}' +
          'px+=vx;py+=vy;cam=px-120;if(pts[pts.length-1].x<px+450)pts.push({x:pts[pts.length-1].x+180,y:45});' +
          'document.getElementById("sc").innerText=Math.floor(px/10);if(py>290||py<-30){px=90;py=110;vx=4;vy=0;}' +
          'ctx.clearRect(0,0,500,280);if(gr){ctx.strokeStyle="#facc15";ctx.beginPath();ctx.moveTo(px-cam,py);ctx.lineTo(gr.x-cam,gr.y);ctx.stroke();}' +
          'ctx.fillStyle="#fb7185";pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x-cam,p.y,7,0,6.28);ctx.fill();});' +
          'ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px-cam,py,10,0,6.28);ctx.fill();},16);') },
      { id: 'banana-sim', title: 'Banana Simulator', tags: ['Clicker', 'Popular'],
        views: '164k', emoji: '🍌', bg: 'linear-gradient(135deg,#eab308,#713f12)',
        html: makeDoc('<div style="text-align:center;"><div id="cnt" style="font-size:44px;font-weight:900;">0</div>' +
          '<button id="ban" style="font-size:86px;background:none;border:none;cursor:pointer;">🍌</button>' +
          '<div id="sh" style="display:flex;gap:8px;margin-top:12px;"></div></div>',
          'var b=0,bps=0,it=[{n:"Monkey",c:15,p:1},{n:"Tree",c:100,p:8},{n:"Factory",c:500,p:40}];' +
          'document.getElementById("ban").onclick=function(){b++;upd();};' +
          'function upd(){document.getElementById("cnt").innerText=Math.floor(b);var s=document.getElementById("sh");s.innerHTML="";' +
          'it.forEach(function(x){var btn=document.createElement("button");btn.innerText=x.n+" ("+x.c+")";' +
          'btn.onclick=function(){if(b>=x.c){b-=x.c;x.c=Math.round(x.c*1.4);bps+=x.p;upd();}};s.appendChild(btn);});}' +
          'setInterval(function(){b+=bps/10;upd();},100);upd();') }
    );
  </script>
  <script>
    var activeCat = 'All', activeGame = null;
    function getFavs() { try { return JSON.parse(localStorage.getItem('lockedFavGames') || '[]'); } catch (e) { return []; } }
    function isFav(id) { return getFavs().indexOf(id) !== -1; }
    function toggleFav(id, e) {
      if (e) e.stopPropagation();
      var f = getFavs(), i = f.indexOf(id);
      if (i === -1) f.push(id); else f.splice(i, 1);
      try { localStorage.setItem('lockedFavGames', JSON.stringify(f)); } catch (err) {}
      renderGamesGrid();
      if (activeGame && activeGame.id === id) document.getElementById('p-fav-btn').innerText = isFav(id) ? '★' : '☆';
    }
    GAMES.slice(0, 3).forEach(function(g) {
      var b = document.createElement('div');
      b.className = 'feat-banner'; b.style.background = g.bg;
      b.innerHTML = '<div class="feat-banner-title">' + g.emoji + ' ' + g.title + '</div>';
      b.onclick = function() { openGamePlayer(g.id); };
      document.getElementById('featured-strip').appendChild(b);
    });
    ['All', 'Popular', 'Favorites', 'Sports', 'Action', 'Clicker'].forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'cat-pill' + (cat === 'All' ? ' active' : '');
      btn.innerText = cat;
      btn.onclick = function() {
        activeCat = cat;
        document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('games-heading').innerText = cat === 'All' ? 'All Games' : cat;
        renderGamesGrid();
      };
      document.getElementById('cat-pills').appendChild(btn);
    });
    function renderGamesGrid() {
      var grid = document.getElementById('games-grid');
      var q = (document.getElementById('games-search').value || '').toLowerCase();
      grid.innerHTML = '';
      GAMES.filter(function(g) {
        return (!q || g.title.toLowerCase().indexOf(q) !== -1) &&
          (activeCat === 'All' || (activeCat === 'Favorites' ? isFav(g.id) : g.tags.indexOf(activeCat) !== -1));
      }).forEach(function(g) {
        var card = document.createElement('div');
        card.className = 'game-card'; card.style.background = g.bg;
        card.onclick = function() { openGamePlayer(g.id); };
        card.innerHTML = '<div class="game-top-overlay"><div>' +
          g.tags.map(function(t) { return '<span class="game-tag-pill">' + t + '</span>'; }).join('') +
          '</div><button class="game-fav-btn" onclick="toggleFav(\'' + g.id + '\',event)">' +
          (isFav(g.id) ? '★' : '☆') + '</button></div><div class="game-art"><div class="game-emoji">' +
          g.emoji + '</div><div class="game-art-label">' + g.title.toUpperCase() + '</div></div>' +
          '<div class="game-bottom-overlay"><div class="game-card-title">' + g.title +
          '</div><div class="game-views-pill">👁 ' + g.views + '</div></div>';
        grid.appendChild(card);
      });
    }
    function openGamePlayer(id) {
      var g = GAMES.find(function(x) { return x.id === id; });
      if (!g) return;
      activeGame = g;
      document.getElementById('games-browse-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'flex';
      document.getElementById('player-splash').style.display = 'flex';
      document.getElementById('player-splash').style.background = g.bg;
      var icon = document.getElementById('player-center-icon');
      icon.style.background = g.bg; icon.innerText = g.emoji;
      var frame = document.getElementById('game-iframe');
      frame.style.display = 'none'; frame.srcdoc = '';
      document.getElementById('p-title').innerText = g.title;
      document.getElementById('p-fav-btn').innerText = isFav(g.id) ? '★' : '☆';
    }
    function launchCurrentGame() {
      if (!activeGame) return;
      document.getElementById('player-splash').style.display = 'none';
      var frame = document.getElementById('game-iframe');
      frame.style.display = 'block'; frame.srcdoc = activeGame.html;
      setTimeout(function() { try { frame.contentWindow.focus(); } catch (e) {} }, 80);
    }
    function closeGamePlayer() {
      var frame = document.getElementById('game-iframe');
      frame.srcdoc = ''; frame.style.display = 'none';
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('games-browse-view').style.display = 'flex';
      activeGame = null;
    }
    function togglePlayerFav() { if (activeGame) toggleFav(activeGame.id); }
    function toggleGameFullscreen() {
      var st = document.getElementById('player-stage');
      if (!document.fullscreenElement) st.requestFullscreen(); else document.exitFullscreen();
    }
    renderGamesGrid();
  </script>
</body>
</html>
