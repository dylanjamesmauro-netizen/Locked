<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css">
  <style>
    .games-page {
      width: 100%;
      max-width: 1220px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .featured-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 820px) {
      .featured-strip { grid-template-columns: 1fr; }
    }
    .feat-banner {
      height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-glow);
      transition: 0.2s;
    }
    .feat-banner:hover {
      transform: translateY(-2px);
      border-color: var(--accent-light);
    }
    .feat-banner-title {
      position: relative;
      z-index: 2;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .games-search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .cat-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cat-pill {
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--row-bg);
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
    }
    body.theme-black-white .cat-pill.active {
      color: #050505;
    }
    .section-heading {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 4px;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 100%;
    }
    @media (max-width: 1080px) {
      .games-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 760px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .game-card {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      cursor: pointer;
      box-shadow: 0 0 18px var(--accent-glow);
      transition: 0.22s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .game-card:hover {
      transform: translateY(-4px) scale(1.025);
      border-color: var(--accent-light);
      box-shadow: 0 0 28px var(--accent-glow-strong);
    }
    .game-art {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
    }
    .game-emoji {
      font-size: 46px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }
    .game-art-label {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
    .game-top-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 3;
    }
    .game-tags {
      display: flex;
      gap: 5px;
    }
    .game-tag-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(10, 8, 22, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
    }
    .game-fav-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    body.theme-black-white .game-fav-btn {
      color: #050505;
    }
    .game-bottom-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 26px 12px 10px 12px;
      background: linear-gradient(180deg, transparent 0%, rgba(5, 4, 12, 0.92) 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 2;
    }
    .game-card-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .game-views-pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(10, 8, 22, 0.8);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
    }
    .player-view {
      display: none;
      width: 100%;
      max-width: 1040px;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 0 auto;
    }
    .player-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 74vh;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #070510;
      box-shadow: 0 0 36px var(--accent-glow);
    }
    .player-splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 4;
    }
    .player-center-icon {
      width: 128px;
      height: 128px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.65);
    }
    .player-play-btn {
      padding: 12px 30px;
      border-radius: 12px;
      border: 1px solid var(--accent-light);
      background: var(--accent-bright);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 24px var(--accent-glow-strong);
    }
    body.theme-black-white .player-play-btn {
      color: #050505;
    }
    .game-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      z-index: 3;
      background: #05050a;
    }
    .player-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    .player-bar-left, .player-bar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .p-icon-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 8px;
    }
    .p-vol-slider {
      width: 96px;
      accent-color: var(--accent-bright);
    }
    .p-fullscreen-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--accent-light);
      background: var(--accent-bright);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    body.theme-black-white .p-fullscreen-btn {
      color: #050505;
    }
  </style>
</head>

        bg: 'linear-gradient(135deg,#334155,#0f172a)',
        html: makeDoc('<div>Distance: <span id="sc">0</span> | Space / Click</div><canvas id="c" width="500" height="220" style="border:2px solid #94a3b8;margin-top:8px;"></canvas>',
          'var c=document.getElementById("c"),ctx=c.getContext("2d"),dy=150,vy=0,ox=500,sc=0;function jmp(){if(dy>=150)vy=-11;}c.onclick=jmp;document.onkeydown=function(e){if(e.code==="Space"||e.key==="ArrowUp")jmp();};' +
          'setInterval(function(){vy+=0.65;dy+=vy;if(dy>150){dy=150;vy=0;}ox-=5.5;if(ox<-20){ox=500+Math.random()*120;sc+=10;document.getElementById("sc").innerText=sc;}if(ox<76&&ox+20>50&&dy+34>154){ox=500;sc=0;document.getElementById("sc").innerText=0;}ctx.clearRect(0,0,500,220);ctx.fillStyle="#64748b";ctx.fillRect(0,184,500,4);ctx.fillStyle="#34d399";ctx.fillRect(50,dy,26,34);ctx.fillStyle="#f43f5e";ctx.fillRect(ox,154,20,30);},16);')
      }
    );
    var activeCat = 'All', activeGame = null;
    function getFavs() { try { return JSON.parse(localStorage.getItem('lockedFavGames') || '[]'); } catch (e) { return []; } }
    function isFav(id) { return getFavs().indexOf(id) !== -1; }
    function toggleFav(id, e) {
      if (e) e.stopPropagation();
      var f = getFavs(), i = f.indexOf(id);
      if (i === -1) f.push(id); else f.splice(i, 1);
      try { localStorage.setItem('lockedFavGames', JSON.stringify(f)); } catch (err) {}
      renderGamesGrid();
      if (activeGame && activeGame.id === id) document.getElementById('p-fav-btn').innerText = isFav(id) ? '★' : '☆';
    }
    var feat = document.getElementById('featured-strip');
    GAMES.slice(0, 3).forEach(function(g) {
      var b = document.createElement('div');
      b.className = 'feat-banner';
      b.style.background = g.bg;
      b.innerHTML = '<div class="feat-banner-title">' + g.emoji + ' ' + g.title + '</div>';
      b.onclick = function() { openGamePlayer(g.id); };
      feat.appendChild(b);
    });
    var pills = document.getElementById('cat-pills');
    ['All', 'Popular', 'Favorites', 'Sports', 'Action', 'Clicker', 'Arcade', 'Classic'].forEach(function(cat) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-pill' + (cat === 'All' ? ' active' : '');
      btn.innerText = cat;
      btn.onclick = function() {
        activeCat = cat;
        document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('games-heading').innerText = (cat === 'All') ? 'All Games' : cat;
        renderGamesGrid();
      };
      pills.appendChild(btn);
    });
    function renderGamesGrid() {
      var grid = document.getElementById('games-grid');
      var q = (document.getElementById('games-search').value || '').trim().toLowerCase();
      grid.innerHTML = '';
      GAMES.filter(function(g) {
        var ms = !q || g.title.toLowerCase().indexOf(q) !== -1;
        var mc = (activeCat === 'All') || (activeCat === 'Favorites' ? isFav(g.id) : g.tags.indexOf(activeCat) !== -1);
        return ms && mc;
      }).forEach(function(g) {
        var card = document.createElement('div');
        card.className = 'game-card';
        card.style.background = g.bg;
        card.onclick = function() { openGamePlayer(g.id); };
        card.innerHTML =
          '<div class="game-top-overlay"><div class="game-tags">' + g.tags.map(function(t) { return '<span class="game-tag-pill">' + t + '</span>'; }).join('') + '</div><button type="button" class="game-fav-btn" onclick="toggleFav(\'' + g.id + '\', event)">' + (isFav(g.id) ? '★' : '☆') + '</button></div>' +
          '<div class="game-art"><div class="game-emoji">' + g.emoji + '</div><div class="game-art-label">' + g.title.toUpperCase() + '</div></div>' +
          '<div class="game-bottom-overlay"><div class="game-card-title">' + g.title + '</div><div class="game-views-pill">👁 ' + g.views + '</div></div>';
        grid.appendChild(card);
      });
    }
    function openGamePlayer(id) {
      var g = GAMES.find(function(x) { return x.id === id; });
      if (!g) return;
      activeGame = g;
      document.getElementById('games-browse-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'flex';
      document.getElementById('player-splash').style.display = 'flex';
      document.getElementById('player-splash').style.background = g.bg;
      var icon = document.getElementById('player-center-icon');
      icon.style.background = g.bg;
      icon.innerText = g.emoji;
      var frame = document.getElementById('game-iframe');
      frame.style.display = 'none';
      frame.removeAttribute('src');
      frame.removeAttribute('srcdoc');
      document.getElementById('p-newtab-btn').style.display = g.url ? 'inline-flex' : 'none';
      document.getElementById('p-title').innerText = g.title;
      document.getElementById('p-fav-btn').innerText = isFav(g.id) ? '★' : '☆';
      document.getElementById('p-views').innerText = '👁 ' + g.views;
      document.getElementById('p-likes').innerText = g.likes;
      document.getElementById('p-dislikes').innerText = g.dislikes;
    }
    function launchCurrentGame() {
      if (!activeGame) return;
      document.getElementById('player-splash').style.display = 'none';
      var frame = document.getElementById('game-iframe');
      frame.style.display = 'block';
      if (activeGame.url) {
        frame.src = activeGame.url;
      } else {
        frame.srcdoc = activeGame.html;
      }
      setTimeout(function() { try { frame.contentWindow.focus(); } catch (e) {} }, 80);
    }
    function openGameNewTab() {
      if (activeGame && activeGame.url) window.open(activeGame.url, '_blank');
    }
    function closeGamePlayer() {
      var frame = document.getElementById('game-iframe');
      frame.removeAttribute('src');
      frame.removeAttribute('srcdoc');
      frame.style.display = 'none';
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('games-browse-view').style.display = 'flex';
      activeGame = null;
    }
    function togglePlayerFav() { if (activeGame) toggleFav(activeGame.id); }
    function bumpStat(k) { if (!activeGame) return; activeGame[k]++; document.getElementById('p-' + k).innerText = activeGame[k]; }
    function toggleGameFullscreen() {
      var st = document.getElementById('player-stage');
      if (!document.fullscreenElement) { if (st.requestFullscreen) st.requestFullscreen(); }
      else { if (document.exitFullscreen) document.exitFullscreen(); }
    }
    renderGamesGrid();
  </script>
</body>
</html>
