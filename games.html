<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css">
  <style>
    .games-page {
      width: 100%;
      max-width: 1220px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .featured-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 820px) {
      .featured-strip { grid-template-columns: 1fr; }
    }
    .feat-banner {
      height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-glow);
      transition: 0.2s;
    }
    .feat-banner:hover {
      transform: translateY(-2px);
      border-color: var(--accent-light);
      box-shadow: 0 0 24px var(--accent-glow-strong);
    }
    .feat-banner-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      filter: blur(1px);
    }
    .feat-banner-title {
      position: relative;
      z-index: 2;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .games-search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .games-search-input:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 24px var(--accent-glow-strong);
    }
    .cat-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cat-pill {
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--row-bg);
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-pill:hover {
      border-color: var(--accent-light);
      color: #fff;
    }
    .cat-pill.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
      box-shadow: 0 0 14px var(--accent-glow);
    }
    body.theme-black-white .cat-pill.active {
      color: #050505;
    }
    .section-heading {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 4px;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 100%;
    }
    @media (max-width: 1080px) {
      .games-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 760px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .game-card {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      background: var(--card-bg);
      cursor: pointer;
      box-shadow: 0 0 18px var(--accent-glow);
      transition: 0.22s;
    }
    .game-card:hover {
      transform: translateY(-4px) scale(1.025);
      border-color: var(--accent-light);
      box-shadow: 0 0 28px var(--accent-glow-strong);
    }
    body.no-hover-transform .game-card:hover {
      transform: none !important;
    }
    .game-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .game-top-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 3;
    }
    .game-tags {
      display: flex;
      gap: 5px;
    }
    .game-tag-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(10, 8, 22, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
    }
    .game-fav-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    body.theme-black-white .game-fav-btn {
      color: #050505;
    }
    .game-bottom-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 26px 12px 10px 12px;
      background: linear-gradient(180deg, transparent 0%, rgba(5, 4, 12, 0.92) 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 2;
    }
    .game-card-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .game-views-pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(10, 8, 22, 0.8);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
    }
    .player-view {
      display: none;
      width: 100%;
      max-width: 1040px;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 0 auto;
    }
    .player-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 74vh;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #070510;
      box-shadow: 0 0 36px var(--accent-glow);
    }
    .player-splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 4;
    }
    .player-blur-bg {
      position: absolute;
      inset: -24px;
      background-size: cover;
      background-position: center;
      filter: blur(22px) brightness(0.65);
      transform: scale(1.08);
      z-index: 1;
    }
    .player-center-icon {
      position: relative;
      z-index: 2;
      width: 128px;
      height: 128px;
      border-radius: 22px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.25);
    }
    .player-play-btn {
      position: relative;
      z-index: 2;
      padding: 12px 30px;
      border-radius: 12px;
      border: 1px solid var(--accent-light);
      background: var(--accent-bright);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    body.theme-black-white .player-play-btn {
      color: #050505;
    }
    .game-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      z-index: 3;
      background: #05050a;
    }
    .player-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    .player-bar-left, .player-bar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .p-icon-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 8px;
    }
    .p-vol-slider {
      width: 96px;
      accent-color: var(--accent-bright);
    }
    .p-fullscreen-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--accent-light);
      background: var(--accent-bright);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    body.theme-black-white .p-fullscreen-btn {
      color: #050505;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="9" height="12" rx="2.5" fill="#ffffff"/><rect x="11" y="4" width="9" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.65"/></svg></div>
        <span class="brand-name">Locked</span>
      </div>
      <input type="text" class="sidebar-search" placeholder="Search games..." onkeydown="if(event.key==='Enter') location.href='games.html?q='+this.value">
      <div class="nav-links">

    </div>
  </div>
  <div class="content" style="padding: 26px 32px;">
    <div class="games-page" id="games-browse-view">
      <div class="featured-strip" id="featured-strip"></div>
      <input type="text" id="games-search" class="games-search-input" placeholder="Search Games Here..." oninput="renderGamesGrid()">
      <div class="cat-pills" id="cat-pills"></div>
      <div class="section-heading" id="games-heading">All Games</div>
      <div class="games-grid" id="games-grid"></div>
    </div>

    <div class="player-view" id="player-view">
      <div class="player-stage" id="player-stage">
        <div class="player-splash" id="player-splash">
          <div class="player-blur-bg" id="player-blur-bg"></div>
          <img class="player-center-icon" id="player-center-icon" src="" alt="Game">
          <button type="button" class="player-play-btn" onclick="launchCurrentGame()">Play Now</button>
        </div>
        <iframe id="game-iframe" class="game-iframe" title="Game Player"></iframe>
      </div>

      <div class="player-bar">
        <div class="player-bar-left">
          <button type="button" class="p-icon-btn" onclick="closeGamePlayer()">← Back</button>
          <span id="p-title" style="font-size:15px; font-weight:800; color:#fff;">Game</span>
          <button type="button" class="p-icon-btn" id="p-fav-btn" onclick="togglePlayerFav()">☆</button>
          <span id="p-views" style="font-size:13px; color:#94a3b8; font-weight:600;">👁 12.4k</span>
          <button type="button" class="p-icon-btn" onclick="bumpStat('likes')">👍 <span id="p-likes">412</span></button>
          <button type="button" class="p-icon-btn" onclick="bumpStat('dislikes')">👎 <span id="p-dislikes">18</span></button>
        </div>
        <div class="player-bar-right">
          <span style="font-size:15px;">🔊</span>
          <input type="range" class="p-vol-slider" min="0" max="100" value="80">
          <button type="button" class="p-fullscreen-btn" title="Fullscreen" onclick="toggleGameFullscreen()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="games-data.js"></script>
</body>
</html>
