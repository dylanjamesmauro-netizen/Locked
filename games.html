<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css">
  <style>
    .games-page {
      width: 100%; max-width: 1220px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .games-search-input {
      width: 100%; padding: 13px 18px; border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg); color: #fff; font-size: 14px;
    }
    .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-pill {
      padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--row-bg); color: #94a3b8;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cat-pill.active {
      background: var(--accent); color: #fff;
    }
    .row-box {
      padding: 16px; border-radius: 18px;
      background: rgba(15, 12, 32, 0.72);
      border: 1px solid var(--border-color);
    }
    .row-head {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .section-heading {
      font-size: 20px; font-weight: 800; color: #f8fafc;
    }
    .row-arrows { display: flex; gap: 6px; }
    .arrow-btn {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg); color: #cbd5e1;
      font-weight: 800; cursor: pointer;
    }
    .h-scroll {
      display: flex; gap: 14px; overflow-x: auto;
      scroll-behavior: smooth; padding-bottom: 4px;
    }
    .games-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
    }
    .game-card {
      position: relative; aspect-ratio: 16 / 10; border-radius: 16px;
      overflow: hidden; border: 2px solid var(--border-color);
      cursor: pointer; display: flex; flex-shrink: 0;
      align-items: center; justify-content: center;
      box-shadow: 0 0 18px var(--accent-glow); transition: 0.2s;
    }
    .game-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--accent-light);
    }
    .pop-card { width: 320px; }
    .rec-card { width: 170px; aspect-ratio: 1 / 1; }
    .game-art { text-align: center; pointer-events: none; }
    .game-emoji { font-size: 46px; }
    .game-art-label {
      font-size: 16px; font-weight: 900; color: #fff;
    }
    .game-top-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; z-index: 3;
    }
    .game-tag-pill {
      padding: 3px 8px; border-radius: 999px; margin-right: 4px;
      background: rgba(10, 8, 22, 0.78);
      color: #f8fafc; font-size: 10px; font-weight: 700;
    }
    .game-fav-btn {
      width: 28px; height: 28px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .game-bottom-overlay {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 20px 12px 10px;
      background: linear-gradient(transparent, rgba(5, 4, 12, 0.94));
      display: flex; justify-content: space-between;
    }
    .game-card-title { font-size: 14px; font-weight: 800; color: #fff; }
    .game-views-pill { font-size: 11px; color: #cbd5e1; }
    .player-view {
      display: none; width: 100%; max-width: 1060px;
      flex-direction: column; align-items: center; gap: 14px;
      margin: 0 auto;
    }
    .player-stage {
      position: relative; width: 100%; height: 78vh;
      border-radius: 20px; overflow: hidden;
      border: 1px solid var(--border-color); background: #070510;
    }
    .player-stage:fullscreen {
      width: 100vw; height: 100vh; border-radius: 0; border: none;
    }
    .game-iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none;
    }
    .player-bar {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; padding: 12px 18px; border-radius: 16px;
      background: var(--card-bg); border: 1px solid var(--border-color);
    }
    .p-icon-btn {
      background: none; border: none; color: #cbd5e1;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .p-fullscreen-btn {
      width: 36px; height: 36px; border-radius: 10px; border: none;
      background: var(--accent-bright); color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="9" height="12" rx="2.5" fill="#ffffff"/><rect x="11" y="4" width="9" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.65"/></svg></div>
        <span class="brand-name">Locked</span>
      </div>
      <input type="text" class="sidebar-search" placeholder="Search games..." onkeydown="if(event.key==='Enter') location.href='games.html?q='+this.value">
      <div class="nav-links">
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>

      </div>
    </div>
    <div class="sidebar-bottom" style="display:flex; flex-direction:column; gap:8px;">
      <a href="account.html" class="nav-item" id="sidebar-account-link"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span id="sidebar-account-text">Sign In</span></a>

    </div>
  </div>
  <div class="content" style="padding: 24px 32px;">
    <div class="games-page" id="games-browse-view">
      <input type="text" id="games-search" class="games-search-input"
        placeholder="Search Games Here..." oninput="renderAll()">
      <div class="cat-pills" id="cat-pills"></div>
      <div class="row-box" id="recent-box" style="display:none;">
        <div class="row-head">
          <div class="section-heading">Recently Played</div>
          <div class="row-arrows">
            <button class="arrow-btn"
              onclick="scrollRow('recent-row',-360)">‹</button>
            <button class="arrow-btn"
              onclick="scrollRow('recent-row',360)">›</button>
          </div>
        </div>
        <div class="h-scroll" id="recent-row"></div>
      </div>
      <div>
        <div class="row-head">
          <div class="section-heading">Most Popular</div>
          <div class="row-arrows">
            <button class="arrow-btn"
              onclick="scrollRow('pop-row',-360)">‹</button>
            <button class="arrow-btn"
              onclick="scrollRow('pop-row',360)">›</button>
          </div>
        </div>
        <div class="h-scroll" id="pop-row"></div>
      </div>
      <div>
        <div class="section-heading" id="games-heading"
          style="margin-bottom:12px;">All Games</div>
        <div class="games-grid" id="games-grid"></div>
      </div>
    </div>
    <div class="player-view" id="player-view">
      <div class="player-stage" id="player-stage">
        <iframe id="game-iframe" class="game-iframe"></iframe>
      </div>
      <div class="player-bar">
        <div>
          <button class="p-icon-btn"
            onclick="closeGamePlayer()">← Back</button>
          <span id="p-title"
            style="font-weight:800;color:#fff;">Game</span>
          <button class="p-icon-btn" id="p-fav-btn"
            onclick="togglePlayerFav()">☆</button>
          <span id="p-views"
            style="font-size:13px;color:#94a3b8;">👁 1.3m</span>
          <button class="p-icon-btn"
            onclick="bumpStat('likes')">👍 <span id="p-likes">4820</span></button>
          <button class="p-icon-btn"
            onclick="bumpStat('dislikes')">👎 <span id="p-dislikes">173</span></button>
        </div>
        <div>
          <span>🔊</span>
          <input type="range" min="0" max="100" value="80">
          <button class="p-fullscreen-btn"
            onclick="toggleGameFullscreen()">⛶</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="games-data.js"></script>
  <script src="games-ui.js"></script>
</body>
</html>
