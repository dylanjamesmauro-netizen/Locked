<head>

  <link rel="stylesheet" href="style.css">
  <style>
    .games-page {
      width: 100%; max-width: 1220px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .games-search-input {
      width: 100%; padding: 13px 18px; border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg); color: #fff; font-size: 14px;
    }
    .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-pill {
      padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--row-bg); color: #94a3b8;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cat-pill.active {
      background: var(--accent); color: #fff;
    }
    .row-box {
      padding: 16px; border-radius: 18px;
      background: rgba(15, 12, 32, 0.72);
      border: 1px solid var(--border-color);
    }
    .row-head {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .section-heading {
      font-size: 20px; font-weight: 800; color: #f8fafc;
    }
    .row-arrows { display: flex; gap: 6px; }
    .arrow-btn {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg); color: #cbd5e1;
      font-weight: 800; cursor: pointer;
    }
    .h-scroll {
      display: flex; gap: 14px; overflow-x: auto;
      scroll-behavior: smooth; padding-bottom: 4px;
    }
    .games-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
    }
    .game-card {
      position: relative; aspect-ratio: 16 / 10; border-radius: 16px;
      overflow: hidden; border: 2px solid var(--border-color);
      cursor: pointer; display: flex; flex-shrink: 0;
      align-items: center; justify-content: center;
      box-shadow: 0 0 18px var(--accent-glow); transition: 0.2s;
    }
    .game-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--accent-light);
    }
    .pop-card { width: 320px; }
    .rec-card { width: 170px; aspect-ratio: 1 / 1; }
    .game-art { text-align: center; pointer-events: none; }
    .game-emoji { font-size: 46px; }
    .game-art-label {
      font-size: 16px; font-weight: 900; color: #fff;
    }
    .game-top-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; z-index: 3;
    }
    .game-tag-pill {
      padding: 3px 8px; border-radius: 999px; margin-right: 4px;
      background: rgba(10, 8, 22, 0.78);
      color: #f8fafc; font-size: 10px; font-weight: 700;
    }
    .game-fav-btn {
      width: 28px; height: 28px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .game-bottom-overlay {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 20px 12px 10px;
      background: linear-gradient(transparent, rgba(5, 4, 12, 0.94));
      display: flex; justify-content: space-between;
    }
    .game-card-title { font-size: 14px; font-weight: 800; color: #fff; }
    .game-views-pill { font-size: 11px; color: #cbd5e1; }
    .player-view {
      display: none; width: 100%; max-width: 1060px;
      flex-direction: column; align-items: center; gap: 14px;
      margin: 0 auto;
    }
    .player-stage {
      position: relative; width: 100%; height: 78vh;
      border-radius: 20px; overflow: hidden;
      border: 1px solid var(--border-color); background: #070510;
    }
    .player-stage:fullscreen {
      width: 100vw; height: 100vh; border-radius: 0; border: none;
    }
    .game-iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none;
    }
    .player-bar {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; padding: 12px 18px; border-radius: 16px;
      background: var(--card-bg); border: 1px solid var(--border-color);
    }
    .p-icon-btn {
      background: none; border: none; color: #cbd5e1;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .p-fullscreen-btn {
      width: 36px; height: 36px; border-radius: 10px; border: none;
      background: var(--accent-bright); color: #fff; cursor: pointer;
    }
  </style>
</head>

  <script>
    var activeCat = 'All', activeGame = null;
    function getList(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } }
    function saveList(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function isFav(id) { return getList('lockedFavGames').indexOf(id) !== -1; }
    function toggleFav(id, e) {
      if (e) e.stopPropagation();
      var f = getList('lockedFavGames'), i = f.indexOf(id);
      if (i === -1) f.push(id); else f.splice(i, 1);
      saveList('lockedFavGames', f); renderAll();
      if (activeGame && activeGame.id === id) document.getElementById('p-fav-btn').innerText = isFav(id) ? '★' : '☆';
    }
    function buildCard(g, cls) {
      var card = document.createElement('div');
      card.className = 'game-card ' + (cls || ''); card.style.background = g.bg;
      card.onclick = function() { openGamePlayer(g.id); };
      card.innerHTML = '<div class="game-top-overlay"><div>' +
        g.tags.map(function(t) { return '<span class="game-tag-pill">' + t + '</span>'; }).join('') +
        '</div><button class="game-fav-btn" onclick="toggleFav(\'' + g.id + '\',event)">' +
        (isFav(g.id) ? '★' : '☆') + '</button></div><div class="game-art"><div class="game-emoji">' +
        g.emoji + '</div><div class="game-art-label">' + g.title.toUpperCase() + '</div></div>' +
        '<div class="game-bottom-overlay"><div class="game-card-title">' + g.title +
        '</div><div class="game-views-pill">👁 ' + g.views + '</div></div>';
      return card;
    }
    function renderPills() {
      var box = document.getElementById('cat-pills'); box.innerHTML = '';
      ['All', 'Favorites', 'Single Player', 'Arcade', 'Casual', 'Action', 'Sports'].forEach(function(cat) {
        var cnt = cat === 'All' ? GAMES.length : cat === 'Favorites' ? getList('lockedFavGames').length :
          GAMES.filter(function(g) { return g.tags.indexOf(cat) !== -1; }).length;
        var btn = document.createElement('button');
        btn.className = 'cat-pill' + (cat === activeCat ? ' active' : '');
        btn.innerText = cat + ' ' + cnt;
        btn.onclick = function() { activeCat = cat; renderAll(); };
        box.appendChild(btn);
      });
    }
    function renderAll() {
      renderPills();
      var recIds = getList('lockedRecentGames'), recBox = document.getElementById('recent-box'), recRow = document.getElementById('recent-row');
      recRow.innerHTML = '';
      var recGames = recIds.map(function(id) { return GAMES.find(function(g) { return g.id === id; }); }).filter(Boolean);
      recBox.style.display = recGames.length ? 'block' : 'none';
      recGames.forEach(function(g) { recRow.appendChild(buildCard(g, 'rec-card')); });
      var popRow = document.getElementById('pop-row'); popRow.innerHTML = '';
      GAMES.slice(0, 5).forEach(function(g) { popRow.appendChild(buildCard(g, 'pop-card')); });
      var grid = document.getElementById('games-grid'), q = (document.getElementById('games-search').value || '').toLowerCase();
      document.getElementById('games-heading').innerText = activeCat === 'All' ? 'All Games' : activeCat;
      grid.innerHTML = '';
      GAMES.filter(function(g) {
        return (!q || g.title.toLowerCase().indexOf(q) !== -1) &&
          (activeCat === 'All' || (activeCat === 'Favorites' ? isFav(g.id) : g.tags.indexOf(activeCat) !== -1));
      }).forEach(function(g) { grid.appendChild(buildCard(g, '')); });
    }
    function scrollRow(id, dx) { document.getElementById(id).scrollLeft += dx; }
    function loadRealOrBackup(g) {
      var frame = document.getElementById('game-iframe');
      var list = REAL_URLS[g.id] || [];
      frame.removeAttribute('srcdoc'); frame.removeAttribute('src');
      if (list.length > 0 && mirrorIdx < list.length) frame.src = list[mirrorIdx];
      else frame.srcdoc = g.html;
    }
    function nextMirror() {
      if (!activeGame) return;
      var list = REAL_URLS[activeGame.id] || [];
      mirrorIdx = (mirrorIdx + 1) % (list.length + 1);
      loadRealOrBackup(activeGame);
    }
    function openGamePlayer(id) {
      var g = GAMES.find(function(x) { return x.id === id; }); if (!g) return;
      activeGame = g; mirrorIdx = 0;
      var rec = getList('lockedRecentGames').filter(function(x) { return x !== id; });
      rec.unshift(id); saveList('lockedRecentGames', rec.slice(0, 10));
      document.getElementById('games-browse-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'flex';
      document.getElementById('p-title').innerText = g.title;
      document.getElementById('p-fav-btn').innerText = isFav(g.id) ? '★' : '☆';
      document.getElementById('p-views').innerText = '👁 ' + g.views;
      document.getElementById('p-likes').innerText = g.likes;
      document.getElementById('p-dislikes').innerText = g.dislikes;
      loadRealOrBackup(g);
    }
    function closeGamePlayer() {
      var frame = document.getElementById('game-iframe');
      frame.removeAttribute('src'); frame.removeAttribute('srcdoc');
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('games-browse-view').style.display = 'flex';
      activeGame = null; renderAll();
    }
    function togglePlayerFav() { if (activeGame) toggleFav(activeGame.id); }
    function bumpStat(k) { if (!activeGame) return; activeGame[k]++; document.getElementById('p-' + k).innerText = activeGame[k]; }
    function toggleGameFullscreen() {
      var st = document.getElementById('player-stage');
      if (!document.fullscreenElement) st.requestFullscreen(); else document.exitFullscreen();
    }
    renderAll();
  </script>
</body>
</html>
