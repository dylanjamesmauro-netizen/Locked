<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-card { width: 100%; max-width: 440px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 32px 28px; box-shadow: 0 0 26px var(--accent-glow); text-align: center; }
    .auth-title { font-size: 30px; font-weight: 800; margin-bottom: 6px; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-sub { color: #94a3b8; font-size: 14px; margin-bottom: 22px; }
    .auth-tabs { display: flex; gap: 8px; background: var(--row-bg); padding: 6px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 9px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #cbd5e1; cursor: pointer; border: none; background: transparent; transition: 0.2s; }
    .auth-tab.active { background: var(--accent); color: white; box-shadow: 0 0 12px var(--accent-glow); }
    body.theme-black-white .auth-tab.active { color: #050505; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .auth-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: white; font-size: 14px; font-weight: 600; outline: none; transition: border-color 0.2s; }
    .auth-input:focus { border-color: var(--accent-light); box-shadow: 0 0 12px var(--accent-glow); }
    .auth-msg { font-size: 13px; font-weight: 600; min-height: 18px; margin-top: 6px; text-align: center; color: #f87171; line-height: 1.4; }
    .auth-msg.ok { color: #34d399; }
    .profile-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: white; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto; box-shadow: 0 0 18px var(--accent-glow); }
    body.theme-black-white .profile-badge { color: #050505; }
    .sync-box { background: var(--row-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin: 18px 0; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="9" height="12" rx="2.5" fill="#ffffff"/><rect x="11" y="4" width="9" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.65"/></svg></div>
        <span class="brand-name">Locked</span>
      </div>
      <input type="text" class="sidebar-search" placeholder="Search games..." onkeydown="if(event.key==='Enter') location.href='games.html?q='+this.value">
      <div class="nav-links">
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
        <a href="games.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>Games</a>
        <a href="ai.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-.5-4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>AI Helper</a>
        <a href="about.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>About</a>
      </div>
    </div>
    <div class="sidebar-bottom" style="display:flex; flex-direction:column; gap:8px;">
      <a href="account.html" class="nav-item active" id="sidebar-account-link"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span id="sidebar-account-text">Sign In</span></a>
      <a href="settings.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Settings</a>
    </div>
  </div>

  <div class="content" style="justify-content: center;">
    <div class="auth-card" id="logged-out-view">
      <div class="auth-title">LOCKED Cloud</div>
      <div class="auth-sub">Save your themes, settings, and progress across any device.</div>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Sign In</button>
        <button type="button" class="auth-tab" id="tab-signup" onclick="switchAuthMode('signup')">Create Account</button>
      </div>
      <form class="auth-form" onsubmit="handleAuthSubmit(event)">
        <input type="text" id="auth-username" class="auth-input" placeholder="Username (letters & numbers)" required minlength="3" maxlength="20">
        <input type="password" id="auth-password" class="auth-input" placeholder="Password (6+ characters)" required minlength="6">
        <button type="submit" class="btn" id="auth-submit-btn" style="width:100%; margin:4px 0 0 0;">Sign In</button>
        <div class="auth-msg" id="auth-msg"></div>
      </form>
    </div>

    <div class="auth-card" id="logged-in-view" style="display:none;">
      <div class="profile-badge" id="profile-initial">L</div>
      <div class="auth-title" id="profile-username">@player</div>
      <div class="auth-sub">Cloud Sync Active</div>
      <div class="sync-box">Your active theme, performance switches, and tab cloaking settings are automatically backed up to your LOCKED Cloud account.</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" class="btn" style="width:100%; margin:0;" onclick="forceCloudPush()">Sync Current Settings Now</button>
        <button type="button" class="btn" style="width:100%; margin:0; opacity:0.85;" onclick="cloudSignOut()">Sign Out</button>
      </div>
      <div class="auth-msg ok" id="sync-status"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    var authMode = 'login';
    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('auth-submit-btn').innerText = (mode === 'login') ? 'Sign In' : 'Create Account';
      document.getElementById('auth-msg').innerText = '';
    }
    async function waitForCloud(ms) {
      var start = Date.now();
      while (!window._cloudReady && !window._cloudError && (Date.now() - start) < ms) {
        await new Promise(function(r) { setTimeout(r, 100); });
      }
      return window._cloudReady;
    }
    async function handleAuthSubmit(e) {
      e.preventDefault();
      var msg = document.getElementById('auth-msg');
      msg.className = 'auth-msg';
      msg.innerText = 'Connecting...';
      var ready = await waitForCloud(5000);
      if (!ready) {
        msg.innerText = window._cloudError || 'Could not reach Firebase. Host the site via http/https (like GitHub Pages) and check your internet.';
        return;
      }
      var rawUser = document.getElementById('auth-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      var pass = document.getElementById('auth-password').value;
      if (rawUser.length < 3) {
        msg.innerText = 'Username must be at least 3 letters/numbers.';
        return;
      }
      var res = (authMode === 'login') ? await window.cloudSignIn(rawUser, pass) : await window.cloudSignUp(rawUser, pass);
      if (res.ok) {
        msg.className = 'auth-msg ok';
        msg.innerText = 'Success!';
      } else {
        msg.innerText = res.error;
      }
    }
    async function forceCloudPush() {
      var st = document.getElementById('sync-status');
      st.innerText = 'Syncing...';
      if (window.saveSettingsToCloud) await window.saveSettingsToCloud();
      st.innerText = 'All settings synced to cloud!';
    }
  </script>
</body>
</html>
