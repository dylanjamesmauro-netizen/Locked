<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <style>
    body { margin: 0; background: black; color: white; font-family: sans-serif; display: flex; }
    .sidebar { width: 220px; height: 100vh; background: #1a1a1a; padding: 20px; box-sizing: border-box; }
    .sidebar input { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: none; box-sizing: border-box; }
    .sidebar a { display: block; color: white; text-decoration: none; padding: 12px 0; font-size: 18px; }
    .sidebar a:hover { color: #3b82f6; }
    .content { flex: 1; text-align: center; padding-top: 80px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; border-radius: 6px; border: none; background: #3b82f6; color: white; }
    button:hover { background: #2563eb; }
    .note { color: #94a3b8; font-size: 13px; max-width: 480px; margin: 15px auto; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>My Site</h2>
    <input type="text" placeholder="Search games..." onkeydown="if(event.key==='Enter') location.href='games.html?q='+this.value">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="ai.html">AI Helper</a>
    <a href="about.html">About</a>
    <a href="settings.html">Settings</a>
  </div>

  <div class="content">
    <h1>Settings</h1>
    
    <p>Tab Cloak & Startup:</p>
    <button onclick="setCleverCloak()">Clever Cloak ("Resources")</button>
    <button onclick="manualAboutBlank()">Open in about:blank</button>
    <button id="auto-btn" onclick="toggleAutoBlank()">Auto about:blank: ON</button>
    <button onclick="resetCloak()">Reset Tab</button>

    <p>Theme Color:</p>
    <button onclick="setTheme('black')">Dark Mode</button>
    <button onclick="setTheme('#0f172a')">Midnight Blue</button>

    <p class="note">Tip: If <b>about:blank</b> doesn't open on startup, click the pop-up blocked icon in your address bar and choose <b>Always allow pop-ups</b>.</p>
  </div>

  <script src="script.js"></script>
  <script>
    function setCleverCloak() {
      localStorage.setItem('siteTitle', 'Resources');
      localStorage.setItem('siteIcon', makeCleverPNG());
      applyCloak();
    }

    function manualAboutBlank() {
      let opened = launchAboutBlank();
      if (!opened) {
        alert('Pop-up was blocked! Click the pop-up icon in your address bar and select "Always allow pop-ups".');
      }
    }

    function updateAutoButton() {
      let isOn = localStorage.getItem('autoBlank') !== 'false';
      document.getElementById('auto-btn').innerText = 'Auto about:blank: ' + (isOn ? 'ON' : 'OFF');
    }

    function toggleAutoBlank() {
      let isOn = localStorage.getItem('autoBlank') !== 'false';
      localStorage.setItem('autoBlank', !isOn);
      updateAutoButton();
    }

    function resetCloak() {
      localStorage.removeItem('siteTitle');
      localStorage.removeItem('siteIcon');
      document.title = 'Settings';
      let icon = document.getElementById('favicon');
      if (icon) icon.remove();
    }

    function setTheme(color) {
      localStorage.setItem('siteBg', color);
      applyTheme();
    }

    updateAutoButton();
  </script>

</body>
</html>
