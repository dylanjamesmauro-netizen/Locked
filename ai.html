<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <link id="favicon" rel="shortcut icon" type="image/png" href="">
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .ai-container { flex: 1; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 18px 24px; }
    .ai-topbar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .mode-pill { display: flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 999px; color: #e2e8f0; font-size: 13px; }
    .mode-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 8px var(--accent-glow-strong); }
    .mode-pill select { background: transparent; border: none; color: #e2e8f0; font-size: 13px; outline: none; cursor: pointer; }
    .mode-pill select option { background: #140e24; color: white; }
    .reset-btn { display: flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-color); color: #cbd5e1; padding: 7px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; }
    .reset-btn:hover { border-color: var(--accent-light); color: white; }
    #ai-hero { flex: 1; display: flex; align-items: center; justify-content: center; }
    .lockedgpt-title { font-size: 42px; font-weight: 700; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    .cursor { display: inline-block; width: 3px; height: 36px; background: var(--accent-light); margin-left: 4px; vertical-align: middle; animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    #chat-messages { display: none; flex: 1; flex-direction: column; gap: 14px; width: 100%; max-width: 820px; margin: 20px auto; overflow-y: auto; padding-right: 6px; }
    .msg-row { display: flex; width: 100%; }
    .user-row { justify-content: flex-end; }
    .ai-row { justify-content: flex-start; }
    .bubble { max-width: 78%; padding: 13px 18px; border-radius: 18px; font-size: 15px; line-height: 1.5; }
    .user-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    body.theme-black-white .user-bubble { color: #050505; }
    .ai-bubble { background: var(--card-bg); border: 1px solid var(--border-color); color: #f1f5f9; border-bottom-left-radius: 4px; }
    .ai-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .input-pill { width: 100%; display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 999px; padding: 6px 8px 6px 22px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4); }
    .input-pill:focus-within { border-color: var(--accent-bright); }
    .input-pill input { flex: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; }
    .input-pill input::placeholder { color: #64748b; }
    .send-circle { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent-bright); color: white; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    body.theme-black-white .send-circle { color: #050505; }
    .send-circle:hover { background: var(--accent); }
    .counter-row { width: 100%; text-align: right; font-size: 11px; color: #64748b; margin-top: 6px; padding-right: 10px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="9" height="12" rx="2.5" fill="#ffffff"/><rect x="11" y="4" width="9" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.65"/></svg></div>
        <span class="brand-name">Locked</span>
      </div>
      <input type="text" class="sidebar-search" placeholder="Search games..." onkeydown="if(event.key==='Enter') location.href='games.html?q='+this.value">
      <div class="nav-links">
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
        <a href="games.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>Games</a>
        <a href="ai.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-.5-4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>AI Helper</a>
        <a href="about.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>About</a>
      </div>
    </div>
    <div class="sidebar-bottom" style="display:flex; flex-direction:column; gap:8px;">
      <a href="account.html" class="nav-item" id="sidebar-account-link"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span id="sidebar-account-text">Sign In</span></a>
      <a href="settings.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Settings</a>
    </div>
  </div>
  <div class="ai-container">
    <div class="ai-topbar">
      <div class="mode-pill"><span class="mode-dot"></span><select id="ai-mode"><option value="General">General</option><option value="Homework & Math">Homework & Math</option><option value="Coding Helper">Coding Helper</option><option value="Game Finder">Game Finder</option></select></div>
      <button type="button" class="reset-btn" onclick="resetChat()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Reset</button>
    </div>
    <div id="ai-hero"><div class="lockedgpt-title">LockedGPT<span class="cursor"></span></div></div>
    <div id="chat-messages"></div>
    <div class="ai-bottom">
      <form class="input-pill" onsubmit="sendMessage(event)"><input type="text" id="chat-input" placeholder="Message AI..." autocomplete="off"><button type="submit" class="send-circle">↑</button></form>
      <div class="counter-row" id="msg-counter">30 messages left today</div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    var messagesLeft = 30;
    async function sendMessage(e) {
      e.preventDefault();
      var input = document.getElementById('chat-input');
      var text = input.value.trim();
      if (!text || messagesLeft <= 0) return;
      document.getElementById('ai-hero').style.display = 'none';
      var chat = document.getElementById('chat-messages');
      chat.style.display = 'flex';
      addBubble(text, 'user-row', 'user-bubble');
      input.value = '';
      messagesLeft--;
      document.getElementById('msg-counter').innerText = messagesLeft + ' messages left today';
      var botBubble = addBubble('Thinking...', 'ai-row', 'ai-bubble');
      var reply = await getAnswer(text);
      botBubble.innerText = reply;
      chat.scrollTop = chat.scrollHeight;
    }
    function addBubble(text, rowClass, bubbleClass) {
      var chat = document.getElementById('chat-messages');
      var row = document.createElement('div');
      row.className = 'msg-row ' + rowClass;
      var bubble = document.createElement('div');
      bubble.className = 'bubble ' + bubbleClass;
      bubble.innerText = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }
    async function getAnswer(prompt) {
      var q = prompt.toLowerCase().trim();
      var mathClean = q.replace(/what is|solve|calculate|\?/g, '').replace(/x/g, '*').trim();
      if (/^[0-9\.\+\-\*\/\(\)\s]+$/.test(mathClean) && /[\+\-\*\/]/.test(mathClean)) {
        try {
          var res = Function('return (' + mathClean + ')')();
          if (typeof res === 'number' && !isNaN(res)) return mathClean + ' = ' + res;
        } catch (err) {}
      }
      var starters = ['what is ', 'who is ', 'who was ', 'tell me about '];
      for (var i = 0; i < starters.length; i++) {
        if (q.startsWith(starters[i])) {
          var topic = prompt.slice(starters[i].length).replace(/\?/g, '').trim();
          try {
            var base = ['https:', '', 'en.wikipedia.org', 'api', 'rest_v1', 'page', 'summary', ''].join('/');
            var w = await fetch(base + encodeURIComponent(topic));
            if (w.ok) {
              var data = await w.json();
              if (data.extract) return data.extract;
            }
          } catch (err) {}
        }
      }
      if (q === 'hi' || q === 'hello' || q === 'hey') return 'Hey! I am LockedGPT. Ask me a math problem or a "What is..." question!';
      if (q.includes('joke')) return 'Why do programmers prefer dark mode? Because light attracts bugs!';
      return 'I heard: "' + prompt + '". Try asking a math problem (like 25 * 14) or "What is gravity?"!';
    }
    function resetChat() {
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-messages').style.display = 'none';
      document.getElementById('ai-hero').style.display = 'flex';
    }
  </script>
</body>
</html>
